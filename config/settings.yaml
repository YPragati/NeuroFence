project:
  name: "NeuroFence"
  version: "0.1.0"

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  db_path: "data/processed/neurofence.db"
  outputs_reports: "outputs/reports"
  outputs_charts: "outputs/charts"
  outputs_logs: "outputs/logs"

model:
  # Safety gate: only these targets are allowed.
  # This is enforced in code, not just documented here.
  allowed_targets:
    - "toy_model"
    - "local_huggingface"
  active_target: "toy_model"
  local_model_name: "distilgpt2"   # small, CPU-friendly default

anomaly_detection:
  default_method: "isolation_forest"
  contamination: 0.1   # expected proportion of anomalies
  # Real statistical anomaly engine over activation measurements.
  # These thresholds are configurable and drive both the anomaly score
  # and the LOW/MEDIUM/HIGH/CRITICAL severity classification.
  statistical:
    severity_cutoffs: [80, 60, 40]   # score >= 80 = CRITICAL, >=60 HIGH, >=40 MEDIUM, else LOW
    z_score_min: 2.0                 # minimum |z| for a feature to be flagged
    baseline_min_n: 2                # baseline needs at least this many normal samples
    score_gain_per_sigma: 10         # anomaly score gain per unit |z| (score = |z| * gain, capped 100)
    correlation_min: 0.6             # profile-correlation threshold used in confidence/evidence

fuzzer:
  seed: 42                 # reproducible fuzzing / prompt generation
  edge_case_count: 5       # number of generated random/edge-case prompts
  mutation_types: null     # null = use all mutations; or subset list e.g. ["case_swap"]

evaluation:
  labeled_validation_split: 0.2
